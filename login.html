<!doctype html><html lang="{{lang}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steel Browser · Login</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ede7;color:#19312c;font-family:"Segoe UI","Malgun Gothic",sans-serif;line-height:1.65;min-height:100vh;display:grid;place-items:center;padding:32px 20px}main{width:min(100%,620px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}header strong{letter-spacing:.12em;font-size:13px}a{color:inherit;text-underline-offset:4px}nav{font-size:12px}article{background:#fffef8;border:1px solid #ced6cb;border-radius:20px;padding:44px;box-shadow:0 20px 60px #19312c0b}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:#627367}h1{font-size:30px;line-height:1.35;letter-spacing:-.04em;margin:12px 0}p{font-size:14px;color:#58665e;margin:0 0 22px}label{display:block;font-weight:600;font-size:14px;margin:25px 0 8px}input{width:100%;font:inherit;padding:13px 15px;border:1px solid #b9c6b9;border-radius:8px;background:#fff}input:focus{outline:3px solid #b9d9a9;outline-offset:2px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:#254d3a;color:white;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#173d2b}.message{color:#a33121;margin:10px 0 0}.message:empty{display:none}aside{border-top:1px solid #e0e5db;margin-top:30px;padding-top:24px}h2{font-size:16px;margin:0 0 12px}.path{color:#254d3a;font-weight:600;background:#f0f4eb;padding:12px 14px;border-radius:8px;overflow-wrap:anywhere}.small{font-size:12px;margin-bottom:12px}footer{text-align:center;font-size:12px;color:#627367;margin-top:24px}@media(max-width:480px){article{padding:26px 22px}h1{font-size:26px}body{padding:24px 16px}}</style>
<main><header><strong>STEEL / BROWSER</strong><nav><a href="?lang=ko" lang="ko">한국어</a> &nbsp; / &nbsp; <a href="?lang=en" lang="en">English</a></nav></header><article><div class="eyebrow">PRIVATE WORKSPACE</div><h1>{{title}}</h1><p>{{intro}}</p><form method="post" action="/_steel/login?lang={{lang}}"><input type="hidden" name="username" value="steel" autocomplete="username"><label for="password">{{password}}</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus maxlength="72"><p class="message" role="alert">{{message}}</p><button type="submit">{{button}}</button></form><aside><h2>{{help}}</h2><p class="path">{{step}}</p><p>{{detail}}</p><p class="small">{{note}}</p><p class="small">{{lost}}</p></aside></article><footer>{{footer}}</footer></main></html>

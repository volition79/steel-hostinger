worker_processes 2;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_upgrade $steel_upstream { default steel-api:3000; '' steel-ui:80; }
  # Aggregate limit: proxy peers may share one IP; do not trust arbitrary forwarded headers.
  limit_req_zone $server_name zone=steel_requests:1m rate=20r/s;
  server {
    listen 8080;
    server_name steel_gateway;
    server_tokens off;
    absolute_redirect off;
    auth_request /_steel/verify;
    limit_req zone=steel_requests burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Authorization "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    location = /_steel/verify {
      internal;
      auth_request off;
      set $auth_backend login:8081;
      proxy_pass http://$auth_backend/verify;
      proxy_method GET;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
    }
    location = /_steel/login {
      auth_request off;
      set $auth_backend login:8081;
      proxy_pass http://$auth_backend;
      proxy_set_header Host $http_host;
      proxy_set_header Authorization "";
    }
    location @login_required {
      if ($http_upgrade != "") { return 401; }
      return 303 /_steel/login;
    }
    # Native Steel viewer, DevTools and browser cast/CDP endpoints.
    location /v1/ { set $backend steel-api:3000; proxy_pass http://$backend; }
    # UI uses /api and /ws prefixes; strip exactly once.
    location /api/ {
      set $backend steel-api:3000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$backend;
    }
    location /ws/ {
      set $backend steel-api:3000;
      rewrite ^/ws/(.*)$ /$1 break;
      proxy_pass http://$backend;
    }
    # Steel advertises a root CDP websocket; ordinary requests serve the UI.
    location / { error_page 401 = @login_required; proxy_pass http://$steel_upstream; }
  }
}

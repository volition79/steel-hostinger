worker_processes 2;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_upgrade $steel_upstream { default steel-api:3000; '' steel-ui:80; }
  # Aggregate limit: proxy peers may share one IP; do not trust arbitrary forwarded headers.
  limit_req_zone $server_name zone=steel_requests:1m rate=20r/s;
  server {
    listen 8080;
    server_name steel_gateway;
    server_tokens off;
    auth_basic "Steel Browser";
    auth_basic_user_file /auth/users;
    limit_req zone=steel_requests burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Authorization "";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    # Native Steel viewer, DevTools and browser cast/CDP endpoints.
    location /v1/ { set $backend steel-api:3000; proxy_pass http://$backend; }
    # UI uses /api and /ws prefixes; strip exactly once.
    location /api/ {
      set $backend steel-api:3000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$backend;
    }
    location /ws/ {
      set $backend steel-api:3000;
      rewrite ^/ws/(.*)$ /$1 break;
      proxy_pass http://$backend;
    }
    # Steel advertises a root CDP websocket; ordinary requests serve the UI.
    location / { proxy_pass http://$steel_upstream; }
  }
}
